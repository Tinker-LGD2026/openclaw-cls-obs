name: release
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm Trusted Publishing requires CLI >= 11.5.1; node 22 ships npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run pack:dist

      # Release gate: the bundle must pass the smoke on both supported host
      # versions before anything is published.
      - name: dual-host compatibility gate
        timeout-minutes: 25
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: sh scripts/compat-matrix.sh

      # Tag must match the package version, otherwise the wrong bits ship.
      - name: tag matches package version
        run: |
          V=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "v$V" ] || { echo "tag ${GITHUB_REF_NAME} != package v$V"; exit 1; }

      # npm Trusted Publishing (OIDC): no stored token. Requires the package's
      # npmjs.com settings to list this repo + workflow as a trusted publisher,
      # and package.json to carry a matching `repository` field for provenance.
      - name: npm publish (skip if version exists)
        working-directory: dist-bundle
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "openclaw-cls-agent-observability@$V" version >/dev/null 2>&1; then
            echo "version $V already published; skipping"
            exit 0
          fi
          npm publish --access public --provenance

      # COS (primary channel). Uses the official Node SDK via probe script.
      # Soft-fails until the bucket vars are configured.
      - name: upload to COS
        if: ${{ vars.COS_BUCKET != '' }}
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
        run: |
          npm install --no-save cos-nodejs-sdk-v5@3.0.0
          V=$(node -p "require('./package.json').version")
          FILES="dist/cls-agent-observability-$V.tar.gz dist/SHA256SUMS"
          [ -f scripts/install.sh ] && FILES="$FILES scripts/install.sh"
          [ -f scripts/uninstall.sh ] && FILES="$FILES scripts/uninstall.sh"
          node scripts/cos-upload.mjs "$V" $FILES
